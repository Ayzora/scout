[project]
name = "scout"
version = "0.1.0"
description = "Autonomous web research and lead enrichment agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "playwright>=1.48",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
artifacts = ["src/scout/api/static/**"]

[tool.pytest.ini_options]
# Hits a real public API. Excluded from the default run so the suite stays
# offline and free: uv run pytest -m live
markers = ["live: calls a real external service"]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]
