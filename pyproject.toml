[project]
name = "scout"
version = "0.1.0"
description = "Local research agent that turns a list of company domains into evidence-backed profiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["research", "lead-enrichment", "agent", "playwright", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=1.1.0",
    "playwright>=1.48",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Source = "https://github.com/Ayzora/scout"
Issues = "https://github.com/Ayzora/scout/issues"

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
artifacts = ["src/scout/api/static/**"]

[tool.pytest.ini_options]
# Hits a real public API. Excluded from the default run so the suite stays
# offline and free: uv run pytest -m live
markers = ["live: calls a real external service"]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
