name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev

      # The browser is a real dependency: a large part of the suite drives
      # Chromium against a fixture site. Cached because it is ~150MB, and the
      # cache lives somewhere different on each platform.
      - name: Playwright cache path
        id: pw
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "dir=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "dir=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "dir=$LOCALAPPDATA\\ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # --with-deps installs system libraries and is Linux-only.
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: uv run playwright install chromium

      - name: Run the tests
        run: uv run pytest -q

      - name: Check the package builds
        run: uv build

  install-script:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Deliberately no uv setup step: the installer's job is to work on a
      # machine that has nothing, which is the one thing a developer's laptop
      # can never test.
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: ./scripts/install.sh

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install.ps1

      - name: Check the install answers for itself
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run scout --help
          uv run scout config

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uvx ruff check src tests --select F,E9
